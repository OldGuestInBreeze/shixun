<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('救助案例管理')"></head>
<body>
<div th:replace="fragments :: adminNav"></div>
<main class="container">
    <section class="page-heading"><h1>救助案例管理</h1><p>维护救助线索处理状态和对外公示进度。</p></section>
    <form class="form-card two-column" method="post" th:object="${caseForm}" th:action="@{/admin/cases}">
        <input type="hidden" th:field="*{id}">
        <label>标题<input th:field="*{title}" required></label>
        <label>动物<input th:field="*{animalName}"></label>
        <label>发现地点<input th:field="*{location}" required></label>
        <label>紧急程度
            <select th:field="*{urgency}"><option value="高">高</option><option value="中">中</option><option value="低">低</option></select>
        </label>
        <label>状态
            <select th:field="*{status}"><option value="待处理">待处理</option><option value="处理中">处理中</option><option value="已完成">已完成</option></select>
        </label>
        <label>联系人<input th:field="*{contactName}"></label>
        <label>联系电话<input th:field="*{contactPhone}"></label>
        <label class="full">说明<textarea th:field="*{description}" rows="4"></textarea></label>
        <button class="button primary" type="submit">保存案例</button>
        <a class="button" th:href="@{/admin/cases}">新增模式</a>
    </form>
    <table class="data-table">
        <thead><tr><th>ID</th><th>标题</th><th>地点</th><th>紧急程度</th><th>状态</th><th>操作</th></tr></thead>
        <tbody>
        <tr th:each="item : ${cases}">
            <td th:text="${item.id}">1</td><td th:text="${item.title}">标题</td><td th:text="${item.location}">地点</td><td th:text="${item.urgency}">中</td><td th:text="${item.status}">处理中</td>
            <td class="actions">
                <a class="text-link" th:href="@{/admin/cases(editId=${item.id})}">编辑</a>
                <form method="post" th:action="@{/admin/cases/{id}/delete(id=${item.id})}">
                    <button class="link-button" type="submit">删除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
