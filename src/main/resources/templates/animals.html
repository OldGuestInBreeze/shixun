<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('动物信息公示')"></head>
<body>
<div th:replace="fragments :: nav"></div>
<main class="container">
    <section class="page-heading"><h1>动物信息公示</h1><p>按名称、类别、品种、地点或状态检索救助站正在照护的动物。</p></section>
    <form class="search-bar" method="get" th:action="@{/animals}">
        <input name="keyword" th:value="${keyword}" placeholder="输入名称、类别、品种或地点">
        <select name="status">
            <option value="">全部状态</option>
            <option value="待领养" th:selected="${status == '待领养'}">待领养</option>
            <option value="康复中" th:selected="${status == '康复中'}">康复中</option>
            <option value="待救助" th:selected="${status == '待救助'}">待救助</option>
            <option value="已领养" th:selected="${status == '已领养'}">已领养</option>
        </select>
        <button class="button primary" type="submit">筛选</button>
    </form>
    <div class="card-grid">
        <article class="animal-card" th:each="animal : ${animals}">
            <img th:src="${animal.imageUrl}" th:alt="${animal.name}">
            <div class="card-body">
                <span class="tag" th:text="${animal.status}">待领养</span>
                <h3 th:text="${animal.name}">团团</h3>
                <p th:text="${animal.species + ' / ' + animal.breed + ' / ' + animal.gender + ' / ' + animal.age + ' 岁'}">信息</p>
                <p th:text="${animal.healthStatus}">健康情况</p>
                <a class="button" th:href="@{/animals/{id}(id=${animal.id})}">查看详情</a>
            </div>
        </article>
    </div>
    <div class="empty" th:if="${#lists.isEmpty(animals)}">暂无符合条件的动物档案。</div>
</main>
<div th:replace="fragments :: footer"></div>
</body>
</html>
