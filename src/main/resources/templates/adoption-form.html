<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('领养申请')"></head>
<body>
<div th:replace="fragments :: publicNav"></div>
<main class="container">
    <section class="page-heading"><h1 th:text="'申请领养 ' + ${animal.name}">申请领养</h1><p>请填写真实联系方式和领养理由，管理员审核后会联系您。</p></section>
    <form class="form-card" method="post" th:object="${application}" th:action="@{/adoptions/apply/{id}(id=${animal.id})}">
        <label>姓名<input th:field="*{applicantName}" required></label>
        <label>电话<input th:field="*{phone}" required></label>
        <label>居住地址<input th:field="*{address}" required></label>
        <label>养宠经验<input th:field="*{experience}"></label>
        <label>领养理由<textarea th:field="*{reason}" rows="5"></textarea></label>
        <button class="button primary" type="submit">提交申请</button>
    </form>
</main>
<div th:replace="fragments :: footer"></div>
</body>
</html>
