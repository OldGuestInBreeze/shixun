<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">流浪动物救助智能信息公示平台</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="nav" class="site-header">
    <div class="container nav">
        <a class="brand" th:href="@{/}">流浪动物救助平台</a>
        <nav>
            <a th:href="@{/animals}">动物公示</a>
            <a th:href="@{/rescue-cases}">救助案例</a>
            <a th:href="@{/rescue-cases/report}">提交线索</a>
            <a th:href="@{/volunteers/apply}">志愿者</a>
            <a th:href="@{/donations/create}">爱心捐赠</a>
            <a th:href="@{/admin}">后台管理</a>
        </nav>
    </div>
</header>
<header th:fragment="adminNav" class="site-header admin-header">
    <div class="container nav">
        <a class="brand" th:href="@{/admin}">救助平台后台</a>
        <nav>
            <a th:href="@{/admin}">看板</a>
            <a th:href="@{/admin/animals}">动物</a>
            <a th:href="@{/admin/cases}">救助</a>
            <a th:href="@{/admin/applications}">领养</a>
            <a th:href="@{/admin/volunteers}">志愿者</a>
            <a th:href="@{/admin/donations}">捐赠</a>
            <a th:href="@{/admin/logout}">退出</a>
        </nav>
    </div>
</header>
<footer th:fragment="footer" class="site-footer">
    <div class="container">公开透明、科学救助、以领养代替购买</div>
</footer>
</body>
</html>
